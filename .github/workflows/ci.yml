name: ci

on: push

jobs:
  ci:
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: [ubuntu-latest]
        node: [24]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install pnpm
        uses: pnpm/action-setup@v6

      - name: Install node
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      # Layouts, error.vue and prerendering are not reachable from the unit
      # suite; only a real generate proves the deployable artifact builds.
      - name: Build
        run: pnpm run build:android:web

      # TEMPORARY — field-test evidence delivery.
      # Delete with app/services/telegramFieldLog.ts; see docs/FIELD_TEST_TELEGRAM.md.
      # The field-test uploader may exist only while it stays out of an
      # ordinary build. This asserts that against the emitted bytes.
      - name: Assert no field-test secrets in the build
        run: pnpm run field:assert-clean
